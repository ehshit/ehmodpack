name: build

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Eh's Modpack
        run: |
          cargo install --git https://github.com/ehshit/ehmodpack --locked
      - name: check lockfile
        run: ehmodpack lock --check
      - name: build every target
        run: ehmodpack build --locked --all
      - uses: actions/upload-artifact@v4
        with:
          name: __SLUG__
          path: dist/*.mrpack
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: __SLUG__
          merge-multiple: true
      - name: read the pack info
        id: meta
        shell: bash
        run: |
          python3 - > info.json <<'EOF'
          import json
          p = json.load(open('packages.json'))
          s = json.load(open('softwares.json'))
          top = (p.get('top') or '')
          targets = []
          for t in s['targets']:
              mc = t['minecraft']
              if mc not in targets:
                  targets.append(mc)
          if top and top in targets:
              targets.remove(top)
              targets.insert(0, top)
          loaders = []
          for t in s['targets']:
              l = t['loader']['type']
              if l not in loaders:
                  loaders.append(l)
          print(json.dumps({'top': top, 'versions': targets, 'loaders': loaders}))
          EOF
          info=$(cat info.json)
          echo "top=$(echo "$info" | python3 -c "import json,sys;print(json.load(sys.stdin)['top'])")" >> "$GITHUB_OUTPUT"
          echo "versions=$(echo "$info" | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin)['versions']))")" >> "$GITHUB_OUTPUT"
          echo "loaders=$(echo "$info" | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin)['loaders']))")" >> "$GITHUB_OUTPUT"
      - name: read the changelog
        shell: bash
        run: |
          python3 - > .ehmodpack-changelog.md <<'EOF'
          import sys, tomllib
          out = []
          try:
              with open("changelog.toml", "rb") as f:
                  data = tomllib.load(f)
              for date in sorted(data, reverse=True):
                  for block in data[date]:
                      text = block.get("changelogtext", "").strip()
                      if text:
                          out.append("**" + date + "**\n\n" + text)
          except FileNotFoundError:
              print("no changelog.toml, publishing without one", file=sys.stderr)
          except Exception as e:
              print("could not read changelog.toml: " + str(e), file=sys.stderr)
          print("\n\n".join(out))
          EOF
      - name: publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          loaders: ${{ fromJson(steps.meta.outputs.loaders) }}
          game-versions: ${{ fromJson(steps.meta.outputs.versions) }}
          version-type: release
          version-name: ${{ steps.meta.outputs.top }}
          changelog-file: .ehmodpack-changelog.md
          files: dist/*.mrpack