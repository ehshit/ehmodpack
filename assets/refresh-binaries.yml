name: refresh

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eh's Modpack
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o "$HOME/.local/bin/ehmodpack" \
            "https://github.com/ehshit/ehmodpack/releases/latest/download/ehmodpack-linux-x86_64"
          chmod +x "$HOME/.local/bin/ehmodpack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: check lockfile
        run: ehmodpack lock --check
      - name: bump mod versions
        run: ehmodpack update --update-changelogs
      - name: count the updated mods
        id: count
        run: |
          echo "n=$(cat .ehmodpack-updates 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
      - name: build every target
        run: ehmodpack build --locked --all
      - uses: actions/upload-artifact@v4
        with:
          name: modpacks
          path: dist/*.mrpack
          if-no-files-found: error
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh-lockfile
          delete-branch: true
          commit-message: 'update: bump mod versions'
          title: 'Update ${{ steps.count.outputs.n }} Mods'
          body: |
            This has been automated due to the `.github/workflows/refresh.yml`, you can re-run to check for it again or merge if this is good

            [Downloads to these modpacks are found here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          add-paths: |-
            packages.json
            ehmodpack.lock.json
            changelog.toml