name: build

"on":
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    outputs:
      version: ${{ steps.ver.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eh's Modpack
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o "$HOME/.local/bin/ehmodpack" \
            "https://github.com/ehshit/ehmodpack/releases/latest/download/ehmodpack-linux-x86_64"
          chmod +x "$HOME/.local/bin/ehmodpack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: sync the manifest version to the tag
        id: ver
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          ehmodpack set-release "$tag"
          if [ -z "$(git status --porcelain packages.json ehmodpack.lock.json)" ]; then
            echo "packages.json was already on $tag"
            exit 0
          fi
          echo "syncing packages.json to $tag and pushing it"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.json ehmodpack.lock.json
          git commit -m "version: $tag"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: check lockfile
        run: ehmodpack lock --check
      - name: build every target
        run: ehmodpack build --locked --all
      - uses: actions/upload-artifact@v4
        with:
          name: modpacks
          path: dist/*.mrpack
          if-no-files-found: error
      - name: read the changelog
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          python3 - > .ehmodpack-changelog.md <<'EOF'
          import sys, tomllib
          out = []
          try:
              with open("changelog.toml", "rb") as f:
                  data = tomllib.load(f)
              for date in sorted(data, reverse=True)[:1]:
                  for block in data[date]:
                      text = block.get("changelogtext", "").strip()
                      if text:
                          out.append("**" + date + "**\n\n" + text)
          except FileNotFoundError:
              print("no changelog.toml, publishing without one", file=sys.stderr)
          except Exception as e:
              print("could not read changelog.toml: " + str(e), file=sys.stderr)
          print("\n\n".join(out))
          EOF
      - name: publish to modrinth
        if: github.ref_type == 'tag'
        run: |
          ehmodpack publish --token "${{ secrets.MODRINTH_TOKEN }}" --project-id "${{ vars.MODRINTH_PROJECT }}"
      - name: release on github
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/*.mrpack \
            --title "${{ github.ref_name }}" \
            --notes-file .ehmodpack-changelog.md \
            || gh release upload "${{ github.ref_name }}" dist/*.mrpack --clobber
