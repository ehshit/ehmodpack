name: build

"on":
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    outputs:
      version: ${{ steps.ver.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eh's Modpack
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -o "$HOME/.local/bin/ehmodpack" \
            "https://github.com/ehshit/ehmodpack/releases/latest/download/ehmodpack-linux-x86_64"
          chmod +x "$HOME/.local/bin/ehmodpack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: sync the manifest version to the tag
        id: ver
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          ehmodpack set-release "$tag"
          if [ -z "$(git status --porcelain packages.json ehmodpack.lock.json)" ]; then
            echo "packages.json was already on $tag"
            exit 0
          fi
          echo "syncing packages.json to $tag and pushing it"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.json ehmodpack.lock.json
          git commit -m "version: $tag"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: check lockfile
        run: ehmodpack lock --check
      - name: build every target
        run: ehmodpack build --locked --all
      - uses: actions/upload-artifact@v4
        with:
          name: modpacks
          path: dist/*.mrpack
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: modpacks
          merge-multiple: true
      - name: read the pack info
        id: meta
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - > info.json <<'EOF'
          import json, os
          p = json.load(open('packages.json'))
          s = json.load(open('softwares.json'))
          top = (p.get('top') or '')
          version = os.environ.get('RELEASE_VERSION') or (p.get('version') or '')
          targets = []
          for t in s['targets']:
              mc = t['minecraft']
              if mc not in targets:
                  targets.append(mc)
          if top and top in targets:
              targets.remove(top)
              targets.insert(0, top)
          loaders = []
          for t in s['targets']:
              l = t['loader']['type']
              if l not in loaders:
                  loaders.append(l)
          print(json.dumps({'top': top, 'version': version, 'versions': targets, 'loaders': loaders}))
          EOF
          info=$(cat info.json)
          echo "top=$(echo "$info" | python3 -c "import json,sys;print(json.load(sys.stdin)['top'])")" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$info" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")" >> "$GITHUB_OUTPUT"
          echo "versions=$(echo "$info" | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin)['versions']))")" >> "$GITHUB_OUTPUT"
          echo "loaders=$(echo "$info" | python3 -c "import json,sys;print(json.dumps(json.load(sys.stdin)['loaders']))")" >> "$GITHUB_OUTPUT"
      - name: read the changelog
        shell: bash
        run: |
          python3 - > .ehmodpack-changelog.md <<'EOF'
          import sys, tomllib
          out = []
          try:
              with open("changelog.toml", "rb") as f:
                  data = tomllib.load(f)
              for date in sorted(data, reverse=True):
                  for block in data[date]:
                      text = block.get("changelogtext", "").strip()
                      if text:
                          out.append("**" + date + "**\n\n" + text)
          except FileNotFoundError:
              print("no changelog.toml, publishing without one", file=sys.stderr)
          except Exception as e:
              print("could not read changelog.toml: " + str(e), file=sys.stderr)
          print("\n\n".join(out))
          EOF
      - name: publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          loaders: ${{ fromJson(steps.meta.outputs.loaders) }}
          game-versions: ${{ fromJson(steps.meta.outputs.versions) }}
          version-type: release
          version-name: ${{ steps.meta.outputs.version }}
          changelog-file: .ehmodpack-changelog.md
          files: dist/*.mrpack