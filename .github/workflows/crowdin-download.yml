name: Crowdin Download

"on":
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  download-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          push_translations: false
          crowdin_branch_name: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Enable bundled locales
        run: python3 scripts/enable_crowdin_locales.py

      - name: Commit translations and bundled locales
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- locales src/locale.rs)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B l10n_crowdin_translations
          git add locales src/locale.rs
          git commit -m "New Crowdin translations"
          git push --force origin l10n_crowdin_translations
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="Hi, there's translations for you, you can re-run the workflow to get more, or merge when it feels good"
          if gh pr view l10n_crowdin_translations --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit l10n_crowdin_translations \
              --repo "$GITHUB_REPOSITORY" \
              --title "New Crowdin translations" \
              --body "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head l10n_crowdin_translations \
              --title "New Crowdin translations" \
              --body "$body"
          fi