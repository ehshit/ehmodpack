name: Test validation

"on":
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - assets/**
      - schema/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - assets/**
      - schema/**

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Is the commit fron a PR?
        id: detect
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "from_pr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="$(git log -1 --pretty=format:'%s')"
          case "$msg" in
            "Merge pull request"*) echo "from_pr=true" ;;
            *) echo "from_pr=false" ;;
          esac >> "$GITHUB_OUTPUT"
      - name: Run Test(s)
        id: tests
        shell: bash
        run: |
          cargo test --locked 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          echo "pass=$status" >> "$GITHUB_OUTPUT"
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8').slice(-40000);
            const passed = ${{ steps.tests.outcome }} == 'success';
            const head = passed
              ? 'The test to it was correct, so this can be safely merged'
              : 'The test to it was failure, something happened within it, please check';
            const body = head + '\n\n```txt\n' + log + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Open Issue (non-PR)
        if: always() && steps.detect.outputs.from_pr == 'false' && steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8').slice(-40000);
            const body = `This issue was auto opened because the latest commit (${context.sha}) had an error when the tests ran\n\n\`\`\`txt\n${log}\n\`\`\``;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const dup = existing.data.some((i) => /tests failed on main/i.test(i.title));
            if (dup) {
              console.log('an issue for this is already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'tests failed on main',
              body,
              assignees: ['huhuhuheh'],
            });