name: Build Binaries

"on":
  push:
    branches:
      - master
    paths:
      - Cargo.toml
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,            arch: windows-x86_64, ext: .exe }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,          arch: linux-x86_64,   ext: ''   }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,         arch: linux-aarch64,  ext: ''   }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf,     arch: linux-armv7,    ext: ''   }
          - { os: ubuntu-latest,  target: i686-unknown-linux-gnu,            arch: linux-i686,     ext: ''   }
          - { os: ubuntu-latest,  target: riscv64gc-unknown-linux-gnu,       arch: linux-riscv64gc, ext: ''  }
          - { os: ubuntu-latest,  target: powerpc64le-unknown-linux-gnu,     arch: linux-powerpc64le, ext: '' }
          - { os: ubuntu-latest,  target: s390x-unknown-linux-gnu,           arch: linux-s390x,    ext: ''   }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: install the cross toolchain
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          package: libdbus-1-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Bundle
        shell: bash
        run: |
          bin="ehmodpack-${{ matrix.arch }}${{ matrix.ext }}"
          mkdir -p bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ehmodpack.exe" "bundle/$bin"
            powershell -NoProfile -Command \
              "Compress-Archive -Force -Path 'bundle/$bin' -DestinationPath 'bundle/ehmodpack-${{ matrix.arch }}.zip'"
          else
            cp "target/${{ matrix.target }}/release/ehmodpack" "bundle/$bin"
            tar -czf "bundle/ehmodpack-${{ matrix.arch }}.tar.gz" -C bundle "$bin"
          fi
          ls -la bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ehmodpack-${{ matrix.arch }}
          path: bundle/*
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          pattern: ehmodpack-linux-*
          merge-multiple: false
      - name: build the linux packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          maintainer="$(grep -m1 '^authors' Cargo.toml | cut -d= -f2- | tr -d '[]"' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]*,[[:space:]]*/, /g')"
          maintainer="${maintainer:-ehmodpack <ehmodpack@ehis.gay>}"
          desc="$(grep -m1 '^package-description' Cargo.toml | cut -d= -f2- | tr -d '"' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          desc="${desc:-it does modpacks because it says so}"
          echo "version=$version"
          echo "maintainer=$maintainer"
          echo "desc=$desc"
          rpmdate="$(LC_ALL=C date '+%a %b %d %Y')"
          echo "rpmdate=$rpmdate"
          mkdir -p out

          icon="$(grep -m1 '^icon = ' Cargo.toml | cut -d= -f2- | tr -d '"' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          icon="${icon:-.github/icon/icon.png}"
          if [ ! -f "$icon" ]; then
            echo "::error::$icon is missing, put a png there"
            exit 1
          fi

          desktop=out/ehmodpack.desktop
          cat > "$desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=eh's modpack
          Comment=it does modpacks because it says so
          Exec=ehmodpack
          Icon=ehmodpack
          Terminal=true
          Categories=Utility;Game;
          EOF
          sed -i 's/^          //' "$desktop"

          deb_arch() {
            case "$1" in
              linux-x86_64) echo amd64 ;;
              linux-aarch64) echo arm64 ;;
              linux-armv7) echo armhf ;;
              linux-i686) echo i386 ;;
              linux-riscv64gc) echo riscv64 ;;
              linux-powerpc64le) echo ppc64el ;;
              linux-s390x) echo s390x ;;
            esac
          }
          rpm_arch() {
            case "$1" in
              linux-x86_64) echo x86_64 ;;
              linux-aarch64) echo aarch64 ;;
              linux-armv7) echo armv7hl ;;
              linux-i686) echo i686 ;;
              linux-powerpc64le) echo ppc64le ;;
              linux-s390x) echo s390x ;;
            esac
          }

          for bin in bin/*/ehmodpack-linux-*; do
            [ -f "$bin" ] || continue
            name="$(basename "$bin")"
            case "$name" in *.tar.gz) continue ;; esac
            arch="${name#ehmodpack-}"
            arch="${arch%-linux-*}"
            [ -n "$arch" ] || continue

            deb="$(deb_arch "$arch")"
            if [ -n "$deb" ]; then
              root="debroot/$deb"
              mkdir -p "$root/DEBIAN"
              install -Dm755 "$bin" "$root/usr/bin/ehmodpack"
              install -Dm644 "$icon" "$root/usr/share/icons/hicolor/256x256/apps/ehmodpack.png"
              install -Dm644 "$desktop" "$root/usr/share/applications/ehmodpack.desktop"
              install -Dm644 LICENSE "$root/usr/share/doc/ehmodpack/copyright"
              inst="$(du -sk "$root" | cut -f1)"
              cat > "$root/DEBIAN/control" <<EOF
          Package: ehmodpack
          Version: $version
          Section: games
          Priority: optional
          Architecture: $deb
          Maintainer: ${maintainer:-ehmodpack}
          Installed-Size: $inst
          Homepage: https://github.com/ehshit/ehmodpack
          Description: $desc
           Build, lock and publish Minecraft modpacks from ehmodpack itself.
          EOF
              sed -i 's/^          //' "$root/DEBIAN/control"
              ( cd "$root" && find . -type f ! -path './DEBIAN/*' -printf '%P\0' \
                | xargs -0 md5sum > DEBIAN/md5sums )
              dpkg-deb --root-owner-group --build "$root" "out/ehmodpack-${version}-${deb}.deb"
              rm -rf "$root"
              echo "made deb for $arch ($deb)"
            fi

            rpm="$(rpm_arch "$arch")"
            if [ -n "$rpm" ]; then
              top="rpmtop/$rpm"
              mkdir -p "$top/SOURCES" "$top/SPECS" "$top/RPMS" "$top/BUILD" "$top/root/usr/bin" \
                       "$top/root/usr/share/icons/hicolor/256x256/apps" \
                       "$top/root/usr/share/applications"
              cp "$bin" "$top/SOURCES/ehmodpack"
              cp LICENSE "$top/SOURCES/LICENSE"
              cp "$icon" "$top/SOURCES/ehmodpack.png"
              cp "$desktop" "$top/SOURCES/ehmodpack.desktop"
              cat > "$top/SPECS/ehmodpack.spec" <<EOF
          Name: ehmodpack
          Version: $version
          Release: 1
          Summary: $desc
          License: MIT
          URL: https://github.com/ehshit/ehmodpack
          Source0: ehmodpack
          Source1: LICENSE
          Source2: ehmodpack.png
          Source3: ehmodpack.desktop
          %description
          Build, lock and publish Minecraft modpacks from ehmodpack itself.
          %install
          install -Dm0755 %{SOURCE0} %{buildroot}/usr/bin/ehmodpack
          install -Dm0644 %{SOURCE1} %{buildroot}/usr/share/doc/ehmodpack/LICENSE
          install -Dm0644 %{SOURCE2} %{buildroot}/usr/share/icons/hicolor/256x256/apps/ehmodpack.png
          install -Dm0644 %{SOURCE3} %{buildroot}/usr/share/applications/ehmodpack.desktop
          %files
          /usr/bin/ehmodpack
          /usr/share/doc/ehmodpack/LICENSE
          /usr/share/icons/hicolor/256x256/apps/ehmodpack.png
          /usr/share/applications/ehmodpack.desktop
          %changelog
          * $rpmdate $maintainer - $version-1
          - initial package
          EOF
              sed -i 's/^          //' "$top/SPECS/ehmodpack.spec"
              rpmbuild -bb --define "_topdir $PWD/$top" --target "$rpm" \
                "$top/SPECS/ehmodpack.spec" >/dev/null
              find "$top/RPMS" -name '*.rpm' -exec mv {} "out/ehmodpack-${version}-${rpm}.rpm" \;
              rm -rf "$top"
              echo "made rpm for $arch ($rpm)"
            fi
          done

          for pair in "x86_64 ehmodpack-linux-x86_64" "aarch64 ehmodpack-linux-aarch64"; do
            set -- $pair
            apparch="$1"; binname="$2"
            [ -f "bin/ehmodpack-$apparch/$binname" ] || continue
            ad="AppDir-$apparch"
            mkdir -p "$ad/usr/bin"
            install -Dm755 "bin/ehmodpack-$apparch/$binname" "$ad/usr/bin/ehmodpack"
            install -Dm644 "$icon" "$ad/ehmodpack.png"
            cp "$desktop" "$ad/ehmodpack.desktop"
            cat > "$ad/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/ehmodpack" "$@"
          EOF
            sed -i 's/^          //' "$ad/AppRun"
            chmod +x "$ad/AppRun"
            tool="appimagetool-$apparch.AppImage"
            curl -sL -o "$tool" "https://github.com/AppImage/AppImageKit/releases/download/continuous/$tool" || continue
            chmod +x "$tool"
            APPIMAGE_EXTRACT_AND_RUN=1 ./"$tool" "$ad" >/dev/null 2>&1 \
              && mv "$ad".AppImage "out/ehmodpack-${version}-${apparch}.AppImage" \
              && echo "made AppImage for $apparch" \
              || echo "AppImage skipped for $apparch (toolchain would not run here)"
            rm -rf "$ad" "$tool"
          done

          rm -rf bin debroot rpmtop
          rm -f out/ehmodpack.desktop
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ehmodpack-packages
          path: out/*
          if-no-files-found: error
  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: ehmodpack-*
          merge-multiple: true
      - name: Decide the version and the tag
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the release notes
        shell: bash
        run: |
          python3 - "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}" > RELEASE_BODY.md <<'EOF'
          import os, tomllib, subprocess, sys
          version = sys.argv[1]
          tag = sys.argv[2]
          repo = os.environ.get("GITHUB_REPOSITORY", "ehshit/ehmodpack")
          base = "https://github.com/" + repo + "/releases/download/" + tag + "/"
          try:
              have = set(os.listdir("downloads"))
          except OSError:
              have = set()
          def link(name, label=None):
              return "[" + (label or name) + "](" + base + name + ")"
          archives = [
              ("Windows x64", "ehmodpack-windows-x86_64.zip"),
              ("Linux x64", "ehmodpack-linux-x86_64.tar.gz"),
              ("Linux ARM64", "ehmodpack-linux-aarch64.tar.gz"),
              ("Linux ARMv7", "ehmodpack-linux-armv7.tar.gz"),
              ("Linux i686", "ehmodpack-linux-i686.tar.gz"),
              ("Linux PowerPC64 LE", "ehmodpack-linux-powerpc64le.tar.gz"),
              ("Linux RISC-V 64", "ehmodpack-linux-riscv64gc.tar.gz"),
              ("Linux s390x", "ehmodpack-linux-s390x.tar.gz"),
          ]
          rows = ["| System | Download |", "| --- | --- |"]
          for label, name in archives:
              if name in have:
                  rows.append("| " + label + " | " + link(name, "Download") + " |")
          deb = {
              "x64": "amd64", "ARM64": "arm64", "ARMv7": "armhf",
              "i686": "i386", "PowerPC64 LE": "ppc64el",
              "RISC-V 64": "riscv64", "s390x": "s390x",
          }
          rpm = {
              "x64": "x86_64", "ARM64": "aarch64", "ARMv7": "armv7hl",
              "i686": "i686", "PowerPC64 LE": "ppc64le", "s390x": "s390x",
          }
          prows = ["| System | deb | rpm |", "| --- | --- | --- |"]
          for label, code in deb.items():
              dname = "ehmodpack-" + version + "-" + code + ".deb"
              rcode = rpm.get(label)
              rname = "ehmodpack-" + version + "-" + rcode + ".rpm" if rcode else None
              dcell = link(dname, "Download") if dname in have else "-"
              rcell = link(rname, "Download") if rname in have else "-"
              prows.append("| " + label + " | " + dcell + " | " + rcell + " |")
          appimgs = sorted(n for n in have if n.endswith(".AppImage"))
          extra = []
          if len(rows) > 2:
              extra.append("## Downloads\n\n" + "\n".join(rows))
          if len(prows) > 2:
              extra.append("## Linux packages\n\n" + "\n".join(prows))
          if appimgs:
              extra.append("## AppImages\n\n" + "\n".join("- " + link(n) for n in appimgs))
          out = []
          entries = []
          try:
              with open("changelog.toml", "rb") as f:
                  data = tomllib.load(f)
              for date in sorted(data, reverse=True):
                  for block in data[date]:
                      text = block.get("changelogtext", "").strip()
                      if text:
                          entries.append("**" + date + "**\n\n" + text)
          except FileNotFoundError:
              print("no changelog.toml, skipping the changelog", file=sys.stderr)
          except Exception as e:
              print("could not read changelog.toml: " + str(e), file=sys.stderr)
          if entries:
              out.append("\n\n".join(entries))
          commits = []
          try:
              prev = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD~1"],
                  capture_output=True, text=True, check=False,
              ).stdout.strip()
              if prev:
                  rng = prev + "..HEAD"
                  raw = subprocess.run(
                      ["git", "log", "--pretty=%h %s", rng, "origin/master"],
                      capture_output=True, text=True, check=False,
                  ).stdout
                  commits = [l for l in raw.splitlines() if l.strip()]
          except Exception:
              pass
          if not commits:
              raw = subprocess.run(
                  ["git", "log", "--pretty=%h %s", "-15", "origin/master"],
                  capture_output=True, text=True, check=False,
              ).stdout
              commits = [l for l in raw.splitlines() if l.strip()]
          out.extend(extra)
          out.append("## Recent Commits")
          out.extend("- " + c for c in commits)
          print("\n".join(out))
          EOF
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              gh release edit "$tag" --notes-file RELEASE_BODY.md
              gh release upload "$tag" downloads/* --clobber
            else
              echo "release $tag already exists and this push did not bump the version, skipping"
              exit 0
            fi
          else
            gh release create "$tag" --generate-notes=false --notes-file RELEASE_BODY.md
            gh release upload "$tag" downloads/* --clobber
          fi
          gh release view "$tag"